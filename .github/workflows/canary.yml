# Canary: regularly verifies the project still builds from scratch.
#
# Local builds run against an already-installed node_modules, which hides
# dependency rot for months. Every run here starts from a clean machine and does
# exactly what a fresh clone does: nvm use → npm ci → build.

name: canary

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 06:00 UTC on the 1st of every month
    - cron: '0 6 1 * *'
  workflow_dispatch:

concurrency:
  group: canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # ci, not install: installs exactly what package-lock.json records, and
      # fails if the lockfile has drifted out of sync with package.json.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:run

      # E2E is heavy (downloads browsers), so it runs on the schedule and on
      # manual dispatch only, not on every push.
      - name: Install Playwright browsers
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run test:e2e:install

      - name: E2E tests
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
