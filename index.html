    <meta charset="UTF-8" />

    <script>
      (function () {
        var RU = (navigator.language || '').indexOf('ru') === 0;
        var T = RU
          ? ['Страница не загрузилась', 'Попробуйте обновить. Если не помогло — напишите, я отвечу.', 'Обновить']
          : ['The page failed to load', 'Try reloading. If that does not help, drop me a line.', 'Reload'];

        function fail(detail) {
          var boot = document.getElementById('boot');
          if (!boot) return;
          console.error('[boot]', detail);

          boot.textContent = '';
          boot.style.cssText =
            'min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;' +
            'gap:20px;padding:24px;text-align:center;font-family:sans-serif;color:#fff';

          function add(tag, text, style) {
            var node = document.createElement(tag);
            node.textContent = text;
            node.style.cssText = style;
            boot.appendChild(node);
            return node;
          }

          add('h1', T[0], 'font-size:28px;font-weight:700');
          add('p', T[1], 'color:#839cb5;max-width:32em;line-height:1.5');
          add(
            'button',
            T[2],
            'padding:10px 28px;border-radius:8px;border:0;background:#fff;color:#000;font-size:16px;cursor:pointer'
          ).onclick = function () {
            location.reload();
          };
          add('a', 'pahovdev@gmail.com', 'color:#839cb5').href = 'mailto:pahovdev@gmail.com';
        }

        addEventListener(
          'error',
          function (e) {
            var t = e.target;
            if (t === window) return fail((e.error && e.error.stack) || e.message);

            if (t.tagName === 'SCRIPT' && t.src.indexOf(location.origin + '/') === 0) fail('failed to load ' + t.src);
          },
          true
        );

        addEventListener('unhandledrejection', function (e) {
          fail((e.reason && e.reason.stack) || e.reason);
        });
      })();
    </script>
