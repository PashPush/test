    <!-- Google tag (gtag.js). Calls queue in dataLayer; the library itself loads after
         `load` + idle, or on the first interaction, whichever comes first. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());

      gtag('config', 'G-2QX4PNFEPB');

      (function () {
        var events = ['scroll', 'pointerdown', 'keydown'];
        var loaded = false;
        function load() {
          if (loaded) return;
          loaded = true;
          events.forEach(function (e) {
            removeEventListener(e, load, true);
          });
          var script = document.createElement('script');
          script.async = true;
          script.src = 'https://www.googletagmanager.com/gtag/js?id=G-2QX4PNFEPB';
          document.head.appendChild(script);
        }
        events.forEach(function (e) {
          addEventListener(e, load, { capture: true, passive: true });
        });
        function idle() {
          if (window.requestIdleCallback) requestIdleCallback(load, { timeout: 3000 });
          else setTimeout(load, 3000);
        }
        // After the first paint as well: where rendering is slow (software GL) `load` comes first.
        addEventListener('load', function () {
          var P = window.PerformanceObserver;
          if (!P || !P.supportedEntryTypes || P.supportedEntryTypes.indexOf('paint') < 0) return idle();
          new P(function (list, observer) {
            if (!list.getEntriesByName('first-contentful-paint').length) return;
            observer.disconnect();
            idle();
          }).observe({ type: 'paint', buffered: true });
        });
      })();
    </script>
